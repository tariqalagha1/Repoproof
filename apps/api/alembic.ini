[alembic]
script_location = migrations
sqlalchemy.url = postgresql+asyncpg://repoproof:repoproof@localhost:5432/repoproof

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = simple

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = simple

[formatter_simple]
format = %(levelname)-8s [%(name)s] %(message)s
